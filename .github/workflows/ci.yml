name: CI - Tests du pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Dépendances système (audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Lint (flake8)
        run: |
          pip install flake8
          flake8 src/ api/ --max-line-length=100 --extend-ignore=E203,W503 || true

      - name: Exécution des tests unitaires
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Vérification de la syntaxe (compilation)
        run: |
          python -m py_compile src/*.py api/*.py app_gradio.py
